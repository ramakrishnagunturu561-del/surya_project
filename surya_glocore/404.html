<!DOCTYPE html>
<html lang="en-US">
<head>
<meta charset="UTF-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>404 - Page Not Found | Surya Power Engineering Services</title>
<link href="wp-content/uploads/2026/07/favicon-1-150x150.png" rel="icon" sizes="32x32"/>
<link href="css/spes-glocore.css" rel="stylesheet" type="text/css"/>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
  body {
    margin: 0;
    padding: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #10151a;
    font-family: 'Inter', sans-serif;
    color: #ffffff;
    text-align: center;
  }
  .spes-404-box {
    max-width: 580px;
    padding: 40px 24px;
  }
  .spes-404-logo {
    width: 64px;
    height: auto;
    margin-bottom: 20px;
  }
  .spes-404-code {
    font-family: 'Archivo', sans-serif;
    font-size: clamp(72px, 12vw, 120px);
    font-weight: 800;
    line-height: 1;
    color: #ff5a1f;
    margin: 0 0 10px;
  }
  .spes-404-title {
    font-size: 24px;
    font-weight: 700;
    margin: 0 0 16px;
    color: #ffffff;
  }
  .spes-404-desc {
    font-size: 16px;
    color: #94a3b8;
    line-height: 1.6;
    margin: 0 0 32px;
  }
  .spes-404-btn {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: linear-gradient(135deg, #ff5a1f 0%, #ff7a45 100%);
    color: #ffffff;
    text-decoration: none;
    font-weight: 700;
    font-size: 15px;
    padding: 14px 34px;
    border-radius: 50px;
    box-shadow: 0 8px 24px rgba(255, 90, 31, 0.4);
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }
  .spes-404-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 30px rgba(255, 90, 31, 0.55);
  }
</style>
</head>
<body>
  <div class="spes-404-box">
    <a href="index.html"><img src="img/logo/spes-logo-mark.png" alt="SPES" class="spes-404-logo"/></a>
    <h1 class="spes-404-code">404</h1>
    <h2 class="spes-404-title">Page Not Found</h2>
    <p class="spes-404-desc">The page you are looking for might have been removed, had its name changed, or is temporarily unavailable.</p>
    <a href="index.html" class="spes-404-btn">Return to Homepage</a>
  </div>
</body>
</html>
